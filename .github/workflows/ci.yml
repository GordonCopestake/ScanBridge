name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore CS3.ScanBridge.slnx --locked-mode
      - name: Build
        run: dotnet build CS3.ScanBridge.slnx -c Release --no-restore
      - name: Test
        run: dotnet test CS3.ScanBridge.slnx -c Release --no-build
