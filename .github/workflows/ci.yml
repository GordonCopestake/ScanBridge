name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore CS3.ScanBridge.slnx --locked-mode
      - name: Build
        run: dotnet build CS3.ScanBridge.slnx -c Release --no-restore
      - name: Test
        run: dotnet test CS3.ScanBridge.slnx -c Release --no-build
