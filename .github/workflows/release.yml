name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CERTIFICATE_PATH: ${{ runner.temp }}\scanbridge-signing.pfx
      EXE_PATH: publish\win-x64\CS3.ScanBridge.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore CS3.ScanBridge.slnx --locked-mode
      - name: Build
        run: dotnet build CS3.ScanBridge.slnx -c Release --no-restore
      - name: Test
        run: dotnet test CS3.ScanBridge.slnx -c Release --no-build
      - name: Publish
        run: >-
          dotnet publish src/CS3.ScanBridge/CS3.ScanBridge.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None
          -o publish/win-x64
      - name: Load signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw "The Windows signing certificate secrets are required. No unsigned release will be created."
          }
          [IO.File]::WriteAllBytes($env:CERTIFICATE_PATH,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
      - name: Sign and verify executable
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "SignTool was not found." }
          & $signTool.FullName sign /f $env:CERTIFICATE_PATH /p $env:SIGNING_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:EXE_PATH
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signTool.FullName verify /pa /all $env:EXE_PATH
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed." }
          Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force
      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: CS3-Scan-Bridge-${{ github.ref_name }}-win-x64
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" $env:EXE_PATH --generate-notes --verify-tag
